<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Véliz — Entrar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="page">

    <!-- Painel de marca -->
    <aside class="brand-panel">
      <div class="brand-panel__content">
        <div class="brand-mark">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M4 9h3l2-4h6l2 4h3l-2 4H6L4 9Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
            <path d="M8 13v6h8v-6M10 9h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="brand-mark__name">Véliz</span>
        </div>

        <h1 class="brand-panel__headline">
          Seu próximo look<br />começa por aqui.
        </h1>
        <p class="brand-panel__sub">
          Entre para salvar seus favoritos, acompanhar seus pedidos e descobrir novas peças.
        </p>

        <div class="barcode barcode--scan" aria-hidden="true">
          <svg viewBox="0 0 220 46" width="220" height="46">
            <rect x="0" y="0" width="1" height="36" fill="currentColor"/>
            <rect x="4" y="0" width="3" height="36" fill="currentColor"/>
            <rect x="10" y="0" width="1" height="36" fill="currentColor"/>
            <rect x="14" y="0" width="2" height="36" fill="currentColor"/>
            <rect x="19" y="0" width="1" height="36" fill="currentColor"/>
            <rect x="23" y="0" width="4" height="36" fill="currentColor"/>
            <rect x="30" y="0" width="1" height="36" fill="currentColor"/>
            <rect x="34" y="0" width="2" height="36" fill="currentColor"/>
            <rect x="39" y="0" width="1" height="36" fill="currentColor"/>
            <rect x="43" y="0" width="1" height="36" fill="currentColor"/>
            <rect x="47" y="0" width="3" height="36" fill="currentColor"/>
            <rect x="53" y="0" width="1" height="36" fill="currentColor"/>
            <rect x="57" y="0" width="2" height="36" fill="currentColor"/>
            <rect x="62" y="0" width="1" height="36" fill="currentColor"/>
            <rect x="66" y="0" width="4" height="36" fill="currentColor"/>
            <rect x="73" y="0" width="1" height="36" fill="currentColor"/>
            <rect x="77" y="0" width="1" height="36" fill="currentColor"/>
            <rect x="81" y="0" width="2" height="36" fill="currentColor"/>
            <rect x="86" y="0" width="1" height="36" fill="currentColor"/>
            <rect x="90" y="0" width="3" height="36" fill="currentColor"/>
            <rect x="96" y="0" width="1" height="36" fill="currentColor"/>
            <rect x="100" y="0" width="2" height="36" fill="currentColor"/>
            <rect x="105" y="0" width="1" height="36" fill="currentColor"/>
            <rect x="109" y="0" width="1" height="36" fill="currentColor"/>
            <rect x="113" y="0" width="4" height="36" fill="currentColor"/>
            <rect x="120" y="0" width="1" height="36" fill="currentColor"/>
            <rect x="124" y="0" width="2" height="36" fill="currentColor"/>
            <rect x="129" y="0" width="1" height="36" fill="currentColor"/>
            <rect x="133" y="0" width="3" height="36" fill="currentColor"/>
            <rect x="139" y="0" width="1" height="36" fill="currentColor"/>
            <rect x="143" y="0" width="1" height="36" fill="currentColor"/>
            <rect x="147" y="0" width="2" height="36" fill="currentColor"/>
            <rect x="152" y="0" width="1" height="36" fill="currentColor"/>
            <rect x="156" y="0" width="4" height="36" fill="currentColor"/>
            <rect x="163" y="0" width="1" height="36" fill="currentColor"/>
            <rect x="167" y="0" width="2" height="36" fill="currentColor"/>
            <rect x="172" y="0" width="1" height="36" fill="currentColor"/>
            <rect x="176" y="0" width="1" height="36" fill="currentColor"/>
            <rect x="180" y="0" width="3" height="36" fill="currentColor"/>
            <rect x="186" y="0" width="1" height="36" fill="currentColor"/>
            <rect x="190" y="0" width="2" height="36" fill="currentColor"/>
            <rect x="195" y="0" width="1" height="36" fill="currentColor"/>
            <rect x="199" y="0" width="4" height="36" fill="currentColor"/>
            <rect x="206" y="0" width="1" height="36" fill="currentColor"/>
            <rect x="210" y="0" width="2" height="36" fill="currentColor"/>
            <rect x="215" y="0" width="1" height="36" fill="currentColor"/>
          </svg>
          <span class="barcode__code">SEU ESTILO, SUA VÉLIZ</span>
        </div>

      </div>
    </aside>

    <!-- Painel de formulário -->
    <main class="form-panel">
      <div class="receipt-card receipt-card--compact">
        <div class="receipt-notch receipt-notch--left" aria-hidden="true"></div>
        <div class="receipt-notch receipt-notch--right" aria-hidden="true"></div>

        <p class="receipt-eyebrow">Área do cliente</p>
        <h2 class="receipt-title">Bem-vindo(a) de volta</h2>
        <p class="receipt-sub">Ainda não tem conta? <a href="cadastro.html" class="link-inline">Criar conta</a></p>

        <form id="login-form" novalidate>

          <div class="field">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" autocomplete="email" placeholder="voce@exemplo.com" />
            <p class="field__error" id="email-error" role="alert"></p>
          </div>

          <div class="field">
            <label for="password">Senha</label>
            <div class="input-with-action">
              <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Sua senha" />
              <button type="button" class="toggle-visibility" data-target="password" aria-label="Mostrar senha" aria-pressed="false">
                <svg class="icon-eye" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
                  <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/>
                </svg>
              </button>
            </div>
            <p class="field__error" id="password-error" role="alert"></p>
          </div>

          <div class="login-options">
            <label class="checkbox-field checkbox-field--inline">
              <input type="checkbox" id="remember" name="remember" />
              <span>Lembrar de mim</span>
            </label>
            <a href="#" class="link-inline">Esqueci minha senha</a>
          </div>

          <button type="submit" class="submit-button" id="submit-button">
            <span class="submit-button__label">Entrar</span>
          </button>

          <p class="form-status" id="form-status" role="status" aria-live="polite"></p>

        </form>

        <div class="divider"><span>ou continue com</span></div>

        <div class="social-buttons">
          <button type="button" class="social-button" data-provider="Google">
            <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
              <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.56 2.7-3.87 2.7-6.62Z"/>
              <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.95v2.33A9 9 0 0 0 9 18Z"/>
              <path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.66 9c0-.59.1-1.17.29-1.7V4.97H.95A9 9 0 0 0 0 9c0 1.45.35 2.83.95 4.03l3-2.33Z"/>
              <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.46 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .95 4.97l3 2.33C4.66 5.17 6.65 3.58 9 3.58Z"/>
            </svg>
            Google
          </button>
          <button type="button" class="social-button" data-provider="Facebook">
            <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
              <path fill="#1877F2" d="M18 9a9 9 0 1 0-10.4 8.89v-6.29H5.31V9h2.29V7.02c0-2.26 1.35-3.51 3.41-3.51.99 0 2.02.18 2.02.18v2.22h-1.14c-1.12 0-1.47.7-1.47 1.41V9h2.5l-.4 2.6h-2.1v6.29A9 9 0 0 0 18 9Z"/>
            </svg>
            Facebook
          </button>
        </div>
      </div>
    </main>

  </div>

  <script src="login.js"></script>
</body>
</html>
