<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Véliz — Criar conta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="page">

    <!-- Painel de marca -->
    <aside class="brand-panel">
      <div class="brand-panel__content">
        <div class="brand-mark">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M4 9h3l2-4h6l2 4h3l-2 4H6L4 9Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
            <path d="M8 13v6h8v-6M10 9h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="brand-mark__name">Véliz</span>
        </div>

        <h1 class="brand-panel__headline">
          Seu estilo merece<br />fazer parte da história.
        </h1>
        <p class="brand-panel__sub">
          Crie sua conta e descubra roupas e acessórios que acompanham o seu ritmo.
        </p>

        <div class="barcode" aria-hidden="true">
          <svg viewBox="0 0 220 46" width="220" height="46">

            <rect x="5" y="0" width="1" height="36" fill="currentColor"/>
            <rect x="9" y="0" width="3" height="36" fill="currentColor"/>
            <rect x="15" y="0" width="1" height="36" fill="currentColor"/>
            <rect x="19" y="0" width="2" height="36" fill="currentColor"/>
            <rect x="24" y="0" width="1" height="36" fill="currentColor"/>
            <rect x="28" y="0" width="4" height="36" fill="currentColor"/>
            <rect x="35" y="0" width="1" height="36" fill="currentColor"/>
            <rect x="39" y="0" width="2" height="36" fill="currentColor"/>
            <rect x="44" y="0" width="1" height="36" fill="currentColor"/>
            <rect x="48" y="0" width="3" height="36" fill="currentColor"/>
            <rect x="54" y="0" width="1" height="36" fill="currentColor"/>
            <rect x="58" y="0" width="1" height="36" fill="currentColor"/>
            <rect x="62" y="0" width="2" height="36" fill="currentColor"/>
            <rect x="67" y="0" width="4" height="36" fill="currentColor"/>
            <rect x="74" y="0" width="1" height="36" fill="currentColor"/>
            <rect x="78" y="0" width="2" height="36" fill="currentColor"/>
            <rect x="83" y="0" width="1" height="36" fill="currentColor"/>
            <rect x="87" y="0" width="1" height="36" fill="currentColor"/>
            <rect x="91" y="0" width="3" height="36" fill="currentColor"/>
            <rect x="97" y="0" width="1" height="36" fill="currentColor"/>
            <rect x="101" y="0" width="2" height="36" fill="currentColor"/>
            <rect x="106" y="0" width="1" height="36" fill="currentColor"/>
            <rect x="110" y="0" width="4" height="36" fill="currentColor"/>
            <rect x="117" y="0" width="1" height="36" fill="currentColor"/>
            <rect x="121" y="0" width="1" height="36" fill="currentColor"/>
            <rect x="125" y="0" width="2" height="36" fill="currentColor"/>
            <rect x="130" y="0" width="1" height="36" fill="currentColor"/>
            <rect x="134" y="0" width="3" height="36" fill="currentColor"/>
            <rect x="140" y="0" width="1" height="36" fill="currentColor"/>
            <rect x="144" y="0" width="2" height="36" fill="currentColor"/>
            <rect x="149" y="0" width="1" height="36" fill="currentColor"/>
            <rect x="153" y="0" width="1" height="36" fill="currentColor"/>
            <rect x="157" y="0" width="4" height="36" fill="currentColor"/>
            <rect x="164" y="0" width="1" height="36" fill="currentColor"/>
            <rect x="168" y="0" width="2" height="36" fill="currentColor"/>
            <rect x="173" y="0" width="1" height="36" fill="currentColor"/>
            <rect x="177" y="0" width="3" height="36" fill="currentColor"/>
            <rect x="183" y="0" width="1" height="36" fill="currentColor"/>
            <rect x="187" y="0" width="1" height="36" fill="currentColor"/>
            <rect x="191" y="0" width="2" height="36" fill="currentColor"/>
            <rect x="196" y="0" width="1" height="36" fill="currentColor"/>
            <rect x="200" y="0" width="4" height="36" fill="currentColor"/>
            <rect x="207" y="0" width="1" height="36" fill="currentColor"/>
            <rect x="211" y="0" width="2" height="36" fill="currentColor"/>
            <rect x="216" y="0" width="1" height="36" fill="currentColor"/>
          </svg>
          <span class="barcode__code">COLEÇÃO VÉLIZ 2026</span>
        </div>

      </div>
    </aside>

    <!-- Painel de formulário -->
    <main class="form-panel">
      <div class="receipt-card">
        <div class="receipt-notch receipt-notch--left" aria-hidden="true"></div>
        <div class="receipt-notch receipt-notch--right" aria-hidden="true"></div>

        <p class="receipt-eyebrow">Novo cadastro</p>
        <h2 class="receipt-title">Crie sua conta</h2>
        <p class="receipt-sub">Já é cliente? <a href="login.html" class="link-inline">Entrar</a></p>

        <form id="signup-form" novalidate>

          <div class="field">
            <label for="name">Nome completo</label>
            <input type="text" id="name" name="name" autocomplete="name" placeholder="Como prefere ser chamado(a)" />
            <p class="field__error" id="name-error" role="alert"></p>
          </div>

          <div class="field">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" autocomplete="email" placeholder="voce@exemplo.com" />
            <p class="field__error" id="email-error" role="alert"></p>
          </div>

          <div class="field">
            <label for="password">Senha</label>
            <div class="input-with-action">
              <input type="password" id="password" name="password" autocomplete="new-password" placeholder="Mínimo de 8 caracteres" />
              <button type="button" class="toggle-visibility" data-target="password" aria-label="Mostrar senha" aria-pressed="false">
                <svg class="icon-eye" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
                  <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/>
                </svg>
              </button>
            </div>

            <div class="seal-meter" id="seal-meter" aria-hidden="true">
              <div class="seal-meter__bars">
                <span class="bar" data-level="1"></span>
                <span class="bar" data-level="2"></span>
                <span class="bar" data-level="3"></span>
                <span class="bar" data-level="4"></span>
              </div>
              <span class="seal-meter__label" id="seal-label">Sem lacre</span>
            </div>
            <p class="field__error" id="password-error" role="alert"></p>
          </div>

          <div class="field">
            <label for="confirm-password">Confirmar senha</label>
            <div class="input-with-action">
              <input type="password" id="confirm-password" name="confirm-password" autocomplete="new-password" placeholder="Repita a senha" />
              <button type="button" class="toggle-visibility" data-target="confirm-password" aria-label="Mostrar senha" aria-pressed="false">
                <svg class="icon-eye" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
                  <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/>
                </svg>
              </button>
            </div>
            <p class="field__error" id="confirm-password-error" role="alert"></p>
          </div>

          <label class="checkbox-field">
            <input type="checkbox" id="terms" name="terms" />
            <span>Concordo com os <a href="#" class="link-inline">termos de uso</a> e a <a href="#" class="link-inline">política de privacidade</a>.</span>
          </label>
          <p class="field__error" id="terms-error" role="alert"></p>

          <button type="submit" class="submit-button" id="submit-button">
            <span class="submit-button__label">Criar conta</span>
          </button>

          <p class="form-status" id="form-status" role="status" aria-live="polite"></p>

        </form>

        <div class="divider"><span>ou continue com</span></div>

        <div class="social-buttons">
          <button type="button" class="social-button" data-provider="Google">
            <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
              <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.56 2.7-3.87 2.7-6.62Z"/>
              <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.95v2.33A9 9 0 0 0 9 18Z"/>
              <path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.66 9c0-.59.1-1.17.29-1.7V4.97H.95A9 9 0 0 0 0 9c0 1.45.35 2.83.95 4.03l3-2.33Z"/>
              <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.46 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .95 4.97l3 2.33C4.66 5.17 6.65 3.58 9 3.58Z"/>
            </svg>
            Google
          </button>
          <button type="button" class="social-button" data-provider="Facebook">
            <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
              <path fill="#1877F2" d="M18 9a9 9 0 1 0-10.4 8.89v-6.29H5.31V9h2.29V7.02c0-2.26 1.35-3.51 3.41-3.51.99 0 2.02.18 2.02.18v2.22h-1.14c-1.12 0-1.47.7-1.47 1.41V9h2.5l-.4 2.6h-2.1v6.29A9 9 0 0 0 18 9Z"/>
            </svg>
            Facebook
          </button>
        </div>
      </div>
    </main>

  </div>

  <script src="cadastro.js"></script>
</body>
</html>
